<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurator Bilah Turbin 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .panel-scroll::-webkit-scrollbar { width: 6px; }
        .panel-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="absolute top-4 left-4 bg-white p-6 rounded-lg shadow-lg w-80 z-10 max-h-[95vh] overflow-y-auto panel-scroll">
        <h1 class="text-xl font-bold mb-4 text-blue-600 border-b pb-2">Parameter Turbin</h1>

        <div class="mb-4">
            <h2 class="text-sm font-semibold text-gray-700 mb-2">Dimensi (mm) & Skala</h2>
            <label class="block text-xs mb-1">Panjang Rentang (Span): <span id="valSpan">150</span></label>
            <input type="range" id="inpSpan" min="50" max="300" value="150" class="w-full mb-2">
            
            <label class="block text-xs mb-1">Perentas Pangkal (Root Chord): <span id="valRoot">40</span></label>
            <input type="range" id="inpRoot" min="20" max="100" value="40" class="w-full mb-2">

            <label class="block text-xs mb-1">Nisbah Tirus (Taper Ratio): <span id="valTaper">0.5</span></label>
            <input type="range" id="inpTaper" min="0.1" max="1.0" step="0.05" value="0.5" class="w-full">
        </div>

        <div class="mb-4">
            <h2 class="text-sm font-semibold text-gray-700 mb-2">Aerodinamik (Darjah)</h2>
            <label class="block text-xs mb-1">Sudut Piuh (Twist Angle): <span id="valTwist">15</span></label>
            <input type="range" id="inpTwist" min="-15" max="45" value="15" class="w-full mb-2">

            <label class="block text-xs mb-1">Sudut Sapuan (Sweep Angle): <span id="valSweep">0</span></label>
            <input type="range" id="inpSweep" min="-20" max="45" value="0" class="w-full">
        </div>

        <div class="mb-4">
            <h2 class="text-sm font-semibold text-gray-700 mb-2">Profil Aerodinamik (NACA)</h2>
            <select id="inpNACA" class="w-full p-2 border border-gray-300 rounded text-sm bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="0012">NACA 0012 (Simetri - Asas)</option>
                <option value="2412">NACA 2412 (Lengkung - Kegunaan Am)</option>
                <option value="4412" selected>NACA 4412 (Lengkung - Daya Angkat Tinggi)</option>
                <option value="6412">NACA 6412 (Lengkung - Agresif)</option>
            </select>
        </div>
        
        <div class="mb-6 border-t pt-4">
            <h2 class="text-sm font-semibold text-gray-700 mb-2">Muat Naik Koordinat (.dat / .txt)</h2>
            <input type="file" id="inpFile" accept=".dat,.txt" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
        </div>
        
        <!-- Butang Tindakan -->
        <div class="flex flex-col gap-2 border-t pt-4">
            <button id="btnExportSTL" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded text-sm transition shadow-sm">
                Muat Turun Fail STL
            </button>
            <button id="btnReset" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded text-sm transition shadow-sm">
                Tetapkan Semula
            </button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="./app.js"></script>

</body>
</html>
