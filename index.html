<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurator Bilah Turbin 3D</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Panel UI (Sidebar) -->
    <div class="absolute top-4 left-4 bg-white p-6 rounded-lg shadow-lg w-80 z-10">
        <h1 class="text-xl font-bold mb-4 text-blue-600 border-b pb-2">Parameter Turbin</h1>

<!-- Geometri Asas -->
        <div class="mb-4">
            <h2 class="text-sm font-semibold text-gray-700 mb-2">Dimensi (mm) & Skala</h2>
            <label class="block text-xs mb-1">Panjang Rentang (Span): <span id="valSpan">150</span></label>
            <input type="range" id="inpSpan" min="50" max="300" value="150" class="w-full mb-2">
            
            <label class="block text-xs mb-1">Perentas Pangkal (Root Chord): <span id="valRoot">40</span></label>
            <input type="range" id="inpRoot" min="20" max="100" value="40" class="w-full mb-2">

            <label class="block text-xs mb-1">Nisbah Tirus (Taper Ratio): <span id="valTaper">0.5</span></label>
            <input type="range" id="inpTaper" min="0.1" max="1.0" step="0.05" value="0.5" class="w-full">
            <p class="text-[10px] text-gray-500 mt-1 mb-2 italic">*Nilai 1.0 bermakna tiada pengecilan di hujung.</p>
        </div>

        <!-- Aerodinamik -->
        <div class="mb-4">
            <h2 class="text-sm font-semibold text-gray-700 mb-2">Aerodinamik (Darjah)</h2>
            <label class="block text-xs mb-1">Sudut Piuh (Twist Angle): <span id="valTwist">15</span></label>
            <input type="range" id="inpTwist" min="-15" max="45" value="15" class="w-full mb-2">

            <label class="block text-xs mb-1">Sudut Sapuan (Sweep Angle): <span id="valSweep">0</span></label>
            <input type="range" id="inpSweep" min="-20" max="45" value="0" class="w-full">
        </div>

    <!-- Kanvas Pemaparan 3D -->
    <div id="canvas-container"></div>

    <!-- Pemuatan Three.js (via CDN) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- Logik Aplikasi -->
    <script type="module" src="./app.js"></script>

</body>
</html>
